[project]
name = "goose-buddy"
version = "0.2.0"
description = "A persistent terminal companion for goose: a port of coding-buddy (the removed Claude Code /buddy)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "mcp>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
goose-buddy = "goose_buddy.cli:main"
goose-buddy-mcp = "goose_buddy.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goose_buddy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
